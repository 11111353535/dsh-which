# dsh bundle patch: inserts this plugin into a profile's layer stack.
#
# `dsh plugin add dsh-which` reads `dsh.bundle.patch` from package.json and
# merges the row below into ~/.dsh/profiles/<profile>/cordis.patch.yml, so the
# user never edits that file by hand.
#
# Optional per-profile tuning (all keys are optional; defaults live in lib/index.js):
#
# - insert:
#     - id: which
#       name: 'dsh-which'
#       config:
#         probeByDefault: false
#         probeTimeoutMs: 4000
#         runtimes: [node, npm, pnpm, python, git]
- insert:
    - id: which
      name: 'dsh-which'
